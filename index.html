<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Type Grow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;cursor:text;font-family:'DM Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%}
#inp{position:fixed;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;font-size:16px;pointer-events:none}
#bar{position:absolute;left:calc(24px + env(safe-area-inset-left));right:calc(24px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;letter-spacing:.04em}
#hints,#ctrls{display:flex;gap:20px;flex-wrap:wrap;opacity:.6;color:#fff}
#rec{min-width:90px}
#ctrls{gap:8px;align-items:center;opacity:1}
#pal{display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid #3a3a3a;border-radius:999px}
.sw{width:22px;height:22px;padding:0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.sw:hover{transform:scale(1.15)}
.sw i{width:10px;height:10px;border-radius:999px}
.btn{background:transparent;border:1px solid #3a3a3a;color:#bdbdbd;font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:#fff;color:#fff}
#motifIn{width:118px;cursor:text;outline:none;transition:transform .15s}
#motifIn.non{animation:non .35s}
@keyframes non{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
select.btn{-webkit-appearance:none;appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 11px) 52%;background-size:4px 4px;background-repeat:no-repeat;max-width:46vw}
#hints{transition:opacity .9s}
.coarse{display:none}
@media (pointer:coarse){.fine{display:none}.coarse{display:inline}}
@media (max-width:600px){
  #bar{left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));gap:10px}
  #hints{gap:12px;font-size:11px}
  #ctrls{flex:1 1 100%;justify-content:flex-start}
  #pal{flex:1 1 100%;justify-content:space-between}
  #pal{gap:4px}
  .sw{width:clamp(13px,calc((100vw - 183px) / 10),22px);height:clamp(13px,calc((100vw - 183px) / 10),22px)}
  .sw i{width:46%;height:46%}
  .btn{padding:7px 11px}
  select.btn{max-width:34vw;padding-right:24px;text-overflow:ellipsis}
  #motifIn{width:30vw}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <input id="inp" aria-label="Taper pour faire pousser un jardin" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="bar">
    <div id="hints">
      <span class="fine">écris la plante de ton choix : rose, lavande, cerisier, tournesol, et même chat, fusée, 火, 愛…</span><span class="coarse">touche et écris la plante de ton choix</span>
      <span>espace coupe</span>
      <span class="fine">retour arrière fane</span>
      <span id="rec" style="opacity:1;font-weight:500"></span>
    </div>
    <div id="ctrls">
      <div id="pal"></div>
      <select class="btn" id="motif" aria-label="un seul motif pour tout le texte" title="un seul motif pour tout le texte"></select>
      <input class="btn" id="motifIn" placeholder="ou écris-le…" aria-label="écrire le motif de tout le texte" title="écris un motif puis Entrée : lavande, cerisier, licorne…" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button class="btn" id="mode"></button>
      <button class="btn" id="png">PNG</button>
      <button class="btn" id="svg">SVG</button>
    </div>
  </div>
</div>

  // ---------- visiteurs animaux ----------

  // ---------- rendu ----------
  frame() {
    const now = performance.now(), dt = Math.min(64, now - (this.lt || now)); this.lt = now;

    const k = 1 - Math.exp(-dt / 80);
    this.Sd += (this.St - this.Sd) * k;
    this.cx += (this.ctx_ - this.cx) * k; this.cy += (this.cty - this.cy) * k;
    for (const l of this.letters) if (!l.dead && l.tx != null) { l.x += (l.tx - l.x) * k; l.y += (l.ty - l.y) * k; }
    this.letters = this.letters.filter(l => !(l.dead && now - l.dead > 300));
    this.paint(now, true);
  }
  mainState() { return { letters: this.letters, S: this.Sd, C: this.pal().C, boil: this.BOIL, recoil: this.RECOIL, speed: 1, wither: 260, face: true }; }

    }
  }
  render(B, now, st) {

  // point de la plante : rebond à la naissance + inclinaison vers le pointeur

  }
  drawStem(B, e, l, age, kk, st, f, amp, layer, frO) {
    const S = st.S, fr = frO != null ? frO : this.eo((age - e.d0) / e.dur) * kk; if (fr <= 0) return;
    const j = this.jit(e.id, f, amp);
    const P = e.pts.map(p => this.wpt(st, l, l.x + p[0] * S + j[0], l.y + p[1] * S + j[1]));
    for (const sg of e.segs) {
      if (sg.layer !== layer) continue;
      const b = Math.min(sg.u1, fr); if (b <= sg.u0) continue;
      this.strokeRange(B, P, sg.u0, b, this.cc.blue, S * 0.022 * (e.w || 1));
    }
    for (const th of e.thorns) if (fr > th.u && this.layerAt(e.segs, th.u) === layer) this.thorn(B, P, th.u, th.s, S);
    if (this.ck && this.ck.nodes) for (let u = 0.12; u < fr; u += 0.14) {
      if (this.layerAt(e.segs, u) !== layer) continue;
      const [q, a] = this.at(P, u), w = S * 0.03 * (e.w || 1), c = Math.cos(a + Math.PI / 2) * w, sn = Math.sin(a + Math.PI / 2) * w;
      B.stroke([[q[0] - c, q[1] - sn], [q[0] + c, q[1] + sn]], this.ck.nodes, Math.max(0.8, S * 0.008));
    }
  }
  drawEl(B, e, l, age, kk, st, f, amp) {
    const S = st.S, j = this.jit(e.id, f, amp), wx = (x, y) => this.wpt(st, l, l.x + x * S + j[0], l.y + y * S + j[1]);
    if (e.t === 'leaf') {
      const sc = this.spr((age - e.d0) / 1000, 7, 15) * kk; if (sc <= 0) return;
      const p = wx(e.x, e.y); this.leaf(B, p[0], p[1], e.a + j[2], e.L * S * sc, e.bend);
    } else if (e.t === 'rose') {
      const a = age - e.d0; if (a < 0 || kk <= 0.001) return;
      const p = wx(e.x, e.y), tl = this.faceTurn(e, p[0], p[1]);
      if (!l.dead && a > 700) this.perch.push({ id: e.id, x: p[0], y: p[1], R: e.R * S * kk });
      this.bloom(B, p[0], p[1], e.R * S * kk, e.rot + j[2] + tl[0] * 0.22, e, a, tl);
    }
  }

  // ---------- export ----------
  dl(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  savePNG() {
    this.paint(performance.now(), false);
    this.cv.toBlob(b => b && this.dl(b, 'garden.png'));
  }
  // SVG : le texte reste en <text> (pas de contours de glyphes)
  saveSVG() {
    const parts = [], n = v => Math.round(v * 100) / 100;
    const pb = () => ({ d: '', moveTo(x, y) { this.d += `M${n(x)} ${n(y)}`; }, lineTo(x, y) { this.d += `L${n(x)} ${n(y)}`; }, quadraticCurveTo(a, b, x, y) { this.d += `Q${n(a)} ${n(b)} ${n(x)} ${n(y)}`; }, closePath() { this.d += 'Z'; } });
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const B = {
      fill: (p, col) => { const b = pb(); this.path(b, p, true); parts.push(`<path d="${b.d}" fill="${this.ink(col)}"/>`); },
      stroke: (p, col, w) => { const b = pb(); this.path(b, p, false); parts.push(`<path d="${b.d}" fill="none" stroke="${this.ink(col)}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"/>`); },
      rect: () => {},
      text: (ch, x, y, S, col) => parts.push(`<text x="${n(x)}" y="${n(y)}" text-anchor="middle" font-family="${this.F.replace(/"/g, "'")}" font-weight="700" font-size="${n(S)}" fill="${col}">${esc(ch)}</text>`)
    };
    this.render(B, performance.now(), this.mainState());
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${n(this.W)}" height="${n(this.H)}" viewBox="0 0 ${n(this.W)} ${n(this.H)}"><rect width="100%" height="100%" fill="${this.pal().bg}"/>${parts.join('')}</svg>`;
    this.dl(new Blob([svg], { type: 'image/svg+xml' }), 'garden.svg');
  }
}
</script>
